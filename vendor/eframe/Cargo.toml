# eframe from storytold/egui at 6d518fc (the rev the root Cargo.toml patches in), vendored for
# PhotoCraft; PATCHES.md lists the changes. Standalone manifest: the egui-family dependencies
# resolve to that same rev through the root's [patch.crates-io].

[package]
name = "eframe"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "egui framework - write GUI apps that compiles to web and/or natively"
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/emilk/egui/tree/main/crates/eframe"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emilk/egui/tree/main/crates/eframe"
categories = ["gui", "game-development"]
keywords = ["egui", "gui", "gamedev"]

[package.metadata.docs]
rs = { all-features = true, targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"], rustdoc-args = ["--generate-link-to-definition"] }

[lib]

[features]
default = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "web_screen_reader", "wgpu", "winit/default", "x11"]
accesskit = ["egui-winit/accesskit"]
android-game-activity = ["egui-winit/android-game-activity"]
android-native-activity = ["egui-winit/android-native-activity"]
default_fonts = ["egui/default_fonts"]
experimental = ["egui/experimental"]
glow = ["dep:egui_glow", "dep:glow", "dep:glutin-winit", "dep:glutin"]
persistence = ["egui-winit/serde", "egui/persistence", "ron", "serde"]
wayland = ["egui-winit/wayland", "egui-wgpu?/wayland", "egui_glow?/wayland", "glutin?/wayland", "glutin-winit?/wayland"]
system_fonts = ["dep:egui_system_font_provider"]
web_screen_reader = ["web-sys/SpeechSynthesis", "web-sys/SpeechSynthesisUtterance"]
wgpu = ["wgpu_no_default_features", "egui-wgpu/default"]
wgpu_no_default_features = ["dep:wgpu", "dep:egui-wgpu", "dep:pollster"]
x11 = ["egui-winit/x11", "egui-wgpu?/x11", "egui_glow?/x11", "glutin?/x11", "glutin?/glx", "glutin-winit?/x11", "glutin-winit?/glx"]
__screenshot = []
inspection = ["dep:egui_inspection", "accesskit"]
links = ["egui-winit/links"]
clipboard = ["egui-winit/clipboard", "egui-winit/clipboard-image"]

[dependencies]
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }
ahash = { version = "0.8.12", default-features = false, features = ["no-rng", "std"] }
document-features = { version = "0.2.12" }
log = { version = "0.4.34", features = ["std"] }
parking_lot = { version = "0.12.5" }
profiling = { version = "1.0", default-features = false }
raw-window-handle = { version = "0.6.2" }
static_assertions = { version = "1.1" }
web-time = { version = "1.1" }
egui_glow = { version = "0.37.0", default-features = false, optional = true }
egui_inspection = { version = "0.37.0", default-features = false, features = ["plugin"], optional = true }
glow = { version = "0.17.0", optional = true }
ron = { version = "0.12.2", features = ["integer128"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
egui-winit = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
egui_system_font_provider = { version = "0.37.0", default-features = false, optional = true }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["winit", "capture"], optional = true }
pollster = { version = "1.0", optional = true }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wgl"], optional = true }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "wgl"], optional = true }

[target."cfg(not(target_arch = \"wasm32\"))".dev-dependencies]
directories = { version = "6.0" }

[target."cfg(any(target_os = \"macos\"))".dependencies]
objc2 = { version = "0.6.4" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }

[target."cfg(any(target_os = \"windows\"))".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(target_arch = \"wasm32\")".dependencies]
bytemuck = { version = "1.25" }
egui = { version = "0.37.0", default-features = false, features = ["web_file"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
js-sys = { version = "0.3.103" }
percent-encoding = { version = "2.3" }
send_wrapper = { version = "0.6" }
wasm-bindgen = { version = "0.2.126" }
web-sys = { version = "0.3.103", features = ["AddEventListenerOptions", "BinaryType", "Blob", "BlobPropertyBag", "Clipboard", "ClipboardEvent", "ClipboardItem", "CanvasRenderingContext2d", "CompositionEvent", "console", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DragEvent", "Element", "Event", "EventListener", "EventTarget", "ExtSRgb", "File", "FileList", "FocusEvent", "FocusOptions", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "InputEvent", "ImageData", "KeyboardEvent", "Location", "MediaQueryList", "MediaQueryListEvent", "MouseEvent", "Navigator", "Node", "NodeList", "Performance", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverSize", "ShadowRoot", "Storage", "TextMetrics", "Touch", "TouchEvent", "PointerEvent", "TouchList", "WebGl2RenderingContext", "WebglDebugRendererInfo", "WebGlRenderingContext", "WheelEvent", "Window"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["capture"], optional = true }
wgpu = { version = "30.0", default-features = false, features = ["std"], optional = true }

[target."cfg(target_arch = \"wasm32\")".dev-dependencies]
wasm-bindgen-test = "=0.3.76"
